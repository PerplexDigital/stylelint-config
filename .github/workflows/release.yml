name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # https://github.com/actions/checkout
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can
          # generate changelogs with the correct commits.
          fetch-depth: 0

      # https://github.com/pnpm/action-setup
      - uses: pnpm/action-setup@v6

      # https://github.com/actions/setup-node
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      # https://github.com/changesets/action
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          pr-title: 'Publish release'
          commit-message: 'chore: publish release'
          # This expects you to have a script called release which does a build
          # for your packages and calls changeset publish
          publish-script: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Merge main into develop
        if: steps.changesets.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge --no-edit --no-verify origin/main
          git push origin develop
